appId: com.freecoder.app
productName: FreeCoder
copyright: Copyright © 2026 FreeCoder

# 使用 node_modules 里已安装的 Electron 发行版打包，避免 electron-builder
# 从 GitHub CDN 下载 electron zip（国内网络常 ETIMEDOUT）
electronDist: node_modules/electron/dist

# 应用自身无原生依赖（react/zustand/archiver 均为纯 JS），跳过 @electron/rebuild，
# 避免其 fork 子进程并加速打包；若未来引入原生模块需移除此项
npmRebuild: false

directories:
  output: release

files:
  - dist/**/*
  - package.json

# 应用图标（窗口/任务栏）、webview 检查器 preload、后端运行时与 DSH 运行时，
# 打包后位于 resources/ 下
extraResources:
  - from: resources/icons/icon.png
    to: icons/icon.png
  - from: resources/preview/inspector.js
    to: preview/inspector.js
  - from: resources/app-runtime
    to: app-runtime
  # DSH 运行时通过 afterPack 钩子复制（见 scripts/after-pack.js）——
  # electron-builder 26 的 extraResources 在 from 顶层恰好是 node_modules 时
  # 会整目录静默跳过（app-builder-lib/out/util/filter.js:43-44 的
  # "filter the root node_modules, but not a subnode_modules" 判断不区分上下文），
  # 而 dsh 运行时恰好是 `node_modules/...`，所以这里改走 hook 兜底。
  # - from: resources/dsh
  #   to: dsh
  # 内置 Node 运行时：dsh headless 依赖按 Node ABI 编译的原生模块（node-pty），
  # 必须用真实 node.exe 运行（不能走 ELECTRON_RUN_AS_NODE）
  - from: resources/node
    to: node

# 见 scripts/after-pack.js——在 win-unpacked 构建完成、portable/NSIS 打包前
# 把本地 resources/dsh 同步复制到 appOutDir/resources/dsh，绕过 extraResources
# 的"from 顶层 node_modules 整目录静默跳过"行为。
afterPack: ./scripts/after-pack.js

win:
  target:
    - target: nsis
    - target: portable
  icon: resources/icons/icon.ico

nsis:
  oneClick: false
  perMachine: true

mac:
  category: public.app-category.developer-tools
  icon: resources/icons/icon.png # electron-builder 自动转为 icns
  target:
    - dmg
    - zip

linux:
  target:
    - AppImage
    - deb
  icon: resources/icons/icon.png
