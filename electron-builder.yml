appId: com.freecoder.app
productName: FreeCoder
copyright: Copyright © 2026 FreeCoder

directories:
  output: release

files:
  - dist/**/*
  - package.json

# 应用图标（窗口/任务栏）、webview 检查器 preload 与后端运行时，打包后位于 resources/ 下
extraResources:
  - from: resources/icons/icon.png
    to: icons/icon.png
  - from: resources/preview/inspector.js
    to: preview/inspector.js
  - from: resources/app-runtime
    to: app-runtime

# DSH / Node 运行时内嵌（WP-08 集成后启用）
# extraResources:
#   - from: resources/node
#     to: node
#   - from: resources/dsh
#     to: dsh

win:
  target:
    - target: nsis
    - target: portable
  icon: resources/icons/icon.ico

nsis:
  oneClick: false
  perMachine: true

mac:
  category: public.app-category.developer-tools
  icon: resources/icons/icon.png   # electron-builder 自动转为 icns
  target:
    - dmg
    - zip

linux:
  target:
    - AppImage
    - deb
  icon: resources/icons/icon.png
